name: Cloudflare Worker probe

on:
  push:
    branches:
      - tech/cloudflare-preview-bypass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opennext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Cloudflare adapter
        run: |
          npm install @opennextjs/cloudflare@latest
          npm install -D wrangler@latest
      - name: Create temporary Cloudflare configs
        shell: bash
        run: |
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "fm-tecnologia-web-platform-probe",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-09-24",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            }
          }
          EOF
      - name: Build Next.js for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Verify Worker artifact
        shell: bash
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Commit generated dependency manifests to technical branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "[skip ci] chore(probe): persist Worker dependency manifests"
            git push origin HEAD:tech/cloudflare-preview-bypass
          fi
