name: Cloudflare Worker probe

on:
  push:
    branches:
      - tech/cloudflare-preview-bypass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opennext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Cloudflare adapter
        run: |
          npm install @opennextjs/cloudflare@latest
          npm install -D wrangler@latest
      - name: Create temporary Cloudflare configs
        shell: bash
        run: |
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "fm-tecnologia-web-platform-probe",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-09-24",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            }
          }
          EOF
      - name: Build Next.js for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Verify Worker artifact
        shell: bash
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Upload generated dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
