name: Site validation
on:
  push:
    branches:
      - feat/site-dev001-foundation
      - 'feat/iron-fit-*'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production runtime smoke
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/fm-web-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then cat /tmp/fm-web-next.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/ > /dev/null || { cat /tmp/fm-web-next.log; exit 1; }
          SITE_URL=http://127.0.0.1:3100 node tests/export-check.mjs
          SITE_URL=http://127.0.0.1:3100 node tests/landing-export-check.mjs
