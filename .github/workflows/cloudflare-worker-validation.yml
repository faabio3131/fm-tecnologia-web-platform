name: Cloudflare Worker validation

on:
  push:
    branches:
      - main
      - feat/fm-premium-uxui-v1
  pull_request:

permissions:
  contents: read

jobs:
  validate-worker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare
      - name: Verify Worker artifact
        shell: bash
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 28
        uses: actions/upload-artifact@v4
        with:
          name: pr28-open-next
          path: .open-next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
