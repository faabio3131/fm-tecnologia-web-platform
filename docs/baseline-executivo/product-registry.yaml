schema_version: "2.0"
registry_status: em_revisao

authority:
  hierarchy:
    - level: 1
      source: decisões executivas expressas do Diretor
    - level: 2
      source: "01 - ARQUITETURA MESTRE - SITE COMERCIAL FM TECNOLOGIA.pdf"
      phase_0_v1_2_read_status: "encontrado e lido integralmente, 7 páginas"
    - level: 3
      source: docs/FASE_0_INVENTARIO_E_READINESS.md
      commit: 6b923ce320d415a4dec5cc3eadd4dc92cb6bbb01
      publication_branch: docs/fase-0-inventario-readiness
    - level: 4
      source: docs/baseline-executivo/**
  reconciliation_note: "A leitura integral da Arquitetura Mestre é herdada da consolidação oficial da Fase 0 v1.2."
  cross_validation_scope: "Fase 0 v1.2 da PR #1 comparada integralmente com os dez documentos da PR #2."
  naming_decision: DEC-04
  brand_decision: DEC-09
  executive_decisions: [DEC-15, DEC-16, DEC-17, DEC-18, DEC-19, DEC-20, DEC-21]
  reconciled_at: "2026-09-09"
  reconciled_by: PENDENTE_EVIDENCIA

status_governance:
  independent_dimensions:
    - portfolio_presence
    - product_lifecycle_status
    - website_visibility
    - technical_readiness
    - certification_status
    - commercial_availability
    - trial_availability
    - pricing_status
    - production_homologation_status
  lifecycle_sequence:
    - research_and_development
    - in_development
    - beta
    - available
  transition_rule: "A mudança de lifecycle altera conteúdo, badge, CTA e permissões comerciais; não exige redesenho da arquitetura do site."
  non_inference_rule: "Produto principal ou informado como pronto não equivale a available, produção homologada, certificação concluída, trial liberado, pricing aprovado ou pagamento disponível."

