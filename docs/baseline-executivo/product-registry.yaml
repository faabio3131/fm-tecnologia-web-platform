# REGISTRO DOCUMENTAL. Não completar fatos sem decisão executiva, Arquitetura Mestre ou Fase 0.
schema_version: "2.0"
registry_status: em_revisao

authority:
  hierarchy:
    - level: 1
      source: decisões executivas expressas do Diretor
    - level: 2
      source: "01 - ARQUITETURA MESTRE - SITE COMERCIAL FM TECNOLOGIA.pdf"
      read_status_inherited_from_phase_0: "encontrado e lido integralmente, 7 páginas"
    - level: 3
      source: docs/FASE_0_INVENTARIO_E_READINESS.md
      phase_0_version: "1.3"
      commit: 34a71f5886ebfaf278be106205284f14eba54664
      publication_branch: docs/fase-0-inventario-readiness
    - level: 4
      source: docs/baseline-executivo/**
  reconciliation_note: "O Baseline foi reconciliado contra a Fase 0 v1.3; decisões comerciais aprovadas não podem voltar a PENDENTE_EVIDENCIA, mas certificação/homologação continuam independentes."
  cross_validation_scope: "Fase 0 v1.3 da PR #1 reconciliada com os documentos da PR #2."
  naming_decision: DEC-04
  brand_decision: DEC-09
  executive_decisions: [DEC-02, DEC-04, DEC-07, DEC-08, DEC-09, DEC-11, DEC-12, DEC-13, DEC-14, DEC-15, DEC-16, DEC-17, DEC-18, DEC-19, DEC-20, DEC-21, DEC-22, DEC-23, DEC-24, DEC-25, DEC-26]
  reconciled_at: "2026-09-08"
  reconciled_by: Diretor + execução documental controlada

status_governance:
  independent_dimensions:
    - portfolio_presence
    - product_lifecycle_status
    - website_visibility
    - technical_readiness
    - certification_status
    - commercial_availability
    - trial_policy_status
    - trial_release_status
    - pricing_status
    - production_homologation_status
  lifecycle_sequence:
    - research_and_development
    - in_development
    - beta
    - available
  transition_rule: "A mudança de lifecycle altera conteúdo, badge, CTA e permissões comerciais; não exige redesenho estrutural do site."
  non_inference_rule: "Produto principal, preço aprovado ou TrialPolicy aprovada não equivalem a available, produção homologada, certificação concluída, billing operacional ou liberação do CTA transacional."

site_commercial_rules:
  primary_domain:
    value: fmtecnologia.ai
    decision: DEC-02
    registration_ownership_status: PENDENTE_EVIDENCIA
  acquisition:
    model: hybrid
    self_service_trial: true
    enterprise_consultative_flow: true
    decision: DEC-22
  account_effectiveness:
    email_verification_required: true
    whatsapp_verification_required: true
    rule: "A conta só é efetivada após as duas validações obrigatórias."
    decision: DEC-11
  support:
    channels: [whatsapp, email]
    automation_24x7: true
    human_24x7_promised: false
    decision: DEC-12
  institutional:
    focus: [empresa, missao, valores]
    founder_personal_page: false
    decision: DEC-24
  infrastructure_direction:
    web: "Next.js/Vercel"
    commercial_core_account_provisioning: AWS
    saas_isolation: contracts_and_adapters
    decision: DEC-13
  ai_architecture:
    provider_agnostic: true
    multi_provider: true
    multi_model: true
    integration_pattern: ai_gateway_and_provider_adapters
    provider_secrets_in_backend_only: true
    governed_fallback: true
    decision: DEC-25
  finops:
    decision: DEC-26
    telemetry_dimensions: [tenant, product, task, provider, model, consumption, cost, latency, result, failure, correlation_id]

